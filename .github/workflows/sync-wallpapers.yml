name: Sync Bing Wallpapers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Wallpaper and Update DB
        id: wallpaper
        run: |
          mkdir -p wallpapers
          
          API_URL="https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=en-US"
          RESPONSE=$(curl -s "$API_URL")
          
          IMG_URL_RELATIVE=$(echo $RESPONSE | jq -r '.images[0].url')
          TITLE=$(echo $RESPONSE | jq -r '.images[0].title')
          COPYRIGHT=$(echo $RESPONSE | jq -r '.images[0].copyright')
          DATE=$(date +'%Y-%m-%d')

          SAFE_TITLE=$(echo "$TITLE" | sed 's/[\/:*?"<>|]/-/g' | tr -cd '[:alnum:] ._-')
          FILENAME="$DATE - $SAFE_TITLE.jpg"
          FULL_URL="https://www.bing.com$IMG_URL_RELATIVE"

          # 🔎 If file already exists → exit early
          if [ -f "wallpapers/$FILENAME" ]; then
            echo "Wallpaper already exists. Skipping..."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Download image
          curl -L -o "wallpapers/$FILENAME" "$FULL_URL"

          # Ensure database exists
          if [ ! -f "wallpapers/database.json" ]; then
            echo "[]" > wallpapers/database.json
          fi

          # Prevent duplicate date in DB
          jq --arg date "$DATE" \
             --arg title "$TITLE" \
             --arg copyright "$COPYRIGHT" \
             --arg file "wallpapers/$FILENAME" \
             'if any(.[]; .date == $date)
              then .
              else [{"date": $date, "title": $title, "copyright": $copyright, "url": $file}] + .
              end' \
             wallpapers/database.json > wallpapers/tmp.json && mv wallpapers/tmp.json wallpapers/database.json

          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit Changes
        if: steps.wallpaper.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add wallpapers/
          git commit -m "Wallpaper Sync: $(date +'%Y-%m-%d')"
          git push

      - name: Setup Pages
        if: steps.wallpaper.outputs.changed == 'true'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: steps.wallpaper.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        if: steps.wallpaper.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
