<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="mb-12">
                <h1 class="text-4xl sm:text-5xl font-bold text-center mb-4">Wallpaper Gallery</h1>
                <p class="text-center text-gray-400 text-lg">Browse our collection of beautiful wallpapers</p>
            </div>

            <!-- Loading State -->
            <div id="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
                <p class="text-gray-400 mt-4">Loading wallpapers...</p>
            </div>

            <!-- Gallery Container -->
            <div id="gallery-container" class="hidden"></div>

            <!-- Error State -->
            <div id="error" class="hidden text-center py-12">
                <p class="text-red-500 text-lg">Failed to load wallpapers. Please try again later.</p>
            </div>
        </div>
    </div>

    <script>
        async function loadAndDisplayWallpapers() {
            try {
                const response = await fetch('wallpapers/database.json');
                if (!response.ok) throw new Error('Failed to fetch database');
                
                const wallpapers = await response.json();
                
                // Group wallpapers by date
                const groupedByDate = {};
                wallpapers.forEach(wallpaper => {
                    const date = wallpaper.date || 'Undated';
                    if (!groupedByDate[date]) {
                        groupedByDate[date] = [];
                    }
                    groupedByDate[date].push(wallpaper);
                });

                // Sort dates in descending order
                const sortedDates = Object.keys(groupedByDate).sort((a, b) => {
                    if (a === 'Undated') return 1;
                    if (b === 'Undated') return -1;
                    return new Date(b) - new Date(a);
                });

                // Generate HTML
                const container = document.getElementById('gallery-container');
                let html = '';

                sortedDates.forEach(date => {
                    const wallpapersForDate = groupedByDate[date];
                    
                    // Format date for display
                    const displayDate = date === 'Undated' ? 'Undated' : new Date(date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    html += `
                        <div class="mb-16">
                            <div class="flex items-center mb-8">
                                <h2 class="text-3xl font-bold">${displayDate}</h2>
                                <span class="ml-4 px-4 py-2 bg-blue-600 rounded-full text-sm font-semibold">
                                    ${wallpapersForDate.length} image${wallpapersForDate.length !== 1 ? 's' : ''}
                                </span>
                            </div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    `;

                    wallpapersForDate.forEach((wallpaper, index) => {
                        html += `
                            <div class="group cursor-pointer" onclick="openModal('${wallpaper.url.replace(/'/g, "\\'")}', '${wallpaper.title.replace(/'/g, "\\'")}')">
                                <div class="relative overflow-hidden rounded-lg bg-gray-800 h-48 mb-3 shadow-lg hover:shadow-2xl transition-shadow duration-300">
                                    <img 
                                        src="${wallpaper.url}" 
                                        alt="${wallpaper.title}"
                                        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
                                        loading="lazy"
                                        onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22200%22 height=%22200%22/%3E%3C/svg%3E'"
                                    />
                                    <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">
                                        <span class="text-white text-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300">👁️</span>
                                    </div>
                                </div>
                                <h3 class="text-sm font-medium text-gray-300 truncate group-hover:text-white transition-colors">
                                    ${wallpaper.title}
                                </h3>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                document.getElementById('loading').classList.add('hidden');
                container.classList.remove('hidden');

            } catch (error) {
                console.error('Error loading wallpapers:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function openModal(imageUrl, title) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center p-4 z-50';
            modal.onclick = (e) => {
                if (e.target === modal) closeModal(modal);
            };

            modal.innerHTML = `
                <div class="relative max-w-4xl max-h-[90vh] w-full h-full flex flex-col">
                    <button 
                        onclick="closeModal(this.closest('.fixed'))"
                        class="absolute -top-10 -right-2 text-white text-3xl font-bold hover:text-gray-300 transition-colors"
                    >
                        ✕
                    </button>
                    <img 
                        src="${imageUrl}" 
                        alt="${title}"
                        class="w-full h-full object-contain rounded-lg"
                    />
                    <div class="text-center mt-4 text-white">
                        <h3 class="text-xl font-semibold">${title}</h3>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        function closeModal(modal) {
            modal.remove();
        }

        // Load wallpapers on page load
        document.addEventListener('DOMContentLoaded', loadAndDisplayWallpapers);
    </script>
</body>
</html>
